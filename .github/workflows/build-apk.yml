name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.1.2"

      - name: Build Android APK with Flet
        run: |
          flet build apk --yes -v
          ls -lh build/apk/
          cp build/apk/*.apk build/apk/REM_v1.3.apk
          cp build/apk/REM_v1.3.apk build/apk/InventarioPro_LiquidCCS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REM-v1.3-Android-APK
          path: build/apk/*.apk
          if-no-files-found: error

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: "REM v1.3 (APK Android Oficial)"
          make_latest: true
          body: |
            ### Novedades de REM v1.3:
            - **Nueva Identidad Visual REM + Logo Oficial**: Renombrado a **REM** con icono y splash oficiales `R·E·M`.
            - **Pestaña Desplegable «Acerca de»**: Nuevo botón en la barra superior con información de la app, datos del autor (`Jhon / LiquidCCS`), versión `v1.3.0` y derechos de autor/copyright.
            - **Textos Descriptivos (Tooltips) en Todos los Botones**: Al dejar el cursor o mantener pulsado sobre cualquier botón, tarjeta o destino del menú se muestra su descripción.
            - **Bloque Ajustado BCV Más Limpio**: Se eliminó el texto inferior `"BCV Directo"`, mostrando directamente el precio ajustado en divisas.
            - **Rendimiento Instantáneo (< 1 ms en RAM + Pool de 24 Tarjetas)** y animaciones fluidas con efecto Hover.
          files: |
            build/apk/REM_v1.3.apk
            build/apk/InventarioPro_LiquidCCS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
