name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.1.2"

      - name: Build Android APK with Flet
        run: |
          flet build apk --yes -v
          ls -lh build/apk/
          cp build/apk/*.apk build/apk/InventarioPro_LiquidCCS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventarioPro-Android-APK
          path: build/apk/*.apk
          if-no-files-found: error

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "Inventario Pro v1.2.0 (APK Android Oficial)"
          make_latest: true
          body: |
            ### Novedades de esta versión:
            - **Interfaz Móvil Optimizada (SafeArea + Menú Compacto Dinámico)**: Al bajar por la lista de productos, el encabezado se contrae automáticamente dejando una barra de búsqueda compacta con accesos rápidos para ver más artículos cómodamente.
            - **Reubicación Limpia de Controles de Tasas**: Botón compacto *Tasa / 1100* arriba junto a *Importar*, botón de recarga BCV en la esquina superior derecha del bloque de tasas y lectura cómoda sin solapamientos.
            - **Orden A-Z inteligente**: Los productos en stock (existencia > 0) aparecen primero de la A a la Z, seguidos al final por los productos agotados (A-Z).
            - **Descripciones cortas**: Características clave visibles directamente en cada producto.
            - **Multiplicador Global Editable (1.100,00)**: Precios en Bolívares y Ajustado BCV calculados dinámicamente con modal rápido de edición.
            - **Modo Oscuro / Claro** con un toque y **100% Offline** con SQLite nativo local.
          files: build/apk/InventarioPro_LiquidCCS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
